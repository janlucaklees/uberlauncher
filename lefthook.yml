pre-commit:
  commands:
    fmt-check:
      run: make fmt-check
    vet:
      run: make vet
    lint:
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          make lint
        else
          echo "[lefthook] golangci-lint not found, skipping lint"
        fi

pre-push:
  commands:
    test:
      run: make test
